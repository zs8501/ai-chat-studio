# Render Blueprint：https://dashboard.render.com/blueprints
services:
  - type: web
    name: ai-chat-studio
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # 不填 LLM_API_KEY 时自动 Mock 演示；充值后可在 Render 控制台补上
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODELS
        value: deepseek-chat,deepseek-reasoner

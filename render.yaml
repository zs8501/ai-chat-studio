# 若 Blueprint 仍要求绑卡：不要用 Blueprint，改为手动 New → Web Service，算力选 Free
services:
  - type: web
    name: ai-chat-studio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODELS
        value: deepseek-chat,deepseek-reasoner
